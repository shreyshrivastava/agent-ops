name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no model needed; the model is faked)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Audit the shareable manifest
        run: PYTHONPATH=src python -m local_agent_ops audit examples/local-agent.manifest.json
