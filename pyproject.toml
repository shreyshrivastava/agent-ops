[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops"
version = "0.3.0"
description = "The auditable local coding agent: approval-gated fixes and reviews with a local Ollama model, and a replayable record of every change."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "shreyshrivastava"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
agent-ops = "local_agent_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
